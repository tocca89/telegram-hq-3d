<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telegram Multi-Agent 3D Virtual Headquarters</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Glass Header -->
  <header class="top-header glass-panel">
    <div class="brand-wrapper">
      <div class="brand-logo">⚡</div>
      <div>
        <div class="brand-title">TELEGRAM MULTI-AGENT HQ</div>
        <div class="brand-subtitle">
          <span class="status-dot"></span> 6 UFFICI COLLEGATI &bull; HOMELAB PERUGIA-VALLADOLID
        </div>
      </div>
    </div>

    <div class="header-actions">
      <button id="reset-cam-btn" class="action-btn" title="Visuale Panoramica">
        <span>🌐</span> Vista Globale
      </button>
      <button id="sound-btn" class="action-btn" title="Attiva/Disattiva Suoni">
        <span id="sound-icon">🔊</span>
      </button>
    </div>
  </header>

  <!-- Bottom Room Switcher Toolbar -->
  <nav class="bottom-nav glass-panel" id="room-nav-bar">
    <button class="room-tab-btn active" data-room="all">
      <span>🌐</span> Tutti
    </button>
    <button class="room-tab-btn" data-room="generale" style="--active-color: #6366f1; --active-glow: rgba(99,102,241,0.5)">
      <span>⚡</span> Generale
    </button>
    <button class="room-tab-btn" data-room="videostudio" style="--active-color: #ec4899; --active-glow: rgba(236,72,153,0.5)">
      <span>🎬</span> Video
    </button>
    <button class="room-tab-btn" data-room="homelab" style="--active-color: #06b6d4; --active-glow: rgba(6,182,212,0.5)">
      <span>🖥️</span> Homelab
    </button>
    <button class="room-tab-btn" data-room="takeoff" style="--active-color: #f59e0b; --active-glow: rgba(245,158,11,0.5)">
      <span>💼</span> TakeOff
    </button>
    <button class="room-tab-btn" data-room="ricette" style="--active-color: #10b981; --active-glow: rgba(16,185,129,0.5)">
      <span>🍳</span> Ricette
    </button>
    <button class="room-tab-btn" data-room="viaggi" style="--active-color: #38bdf8; --active-glow: rgba(56,189,248,0.5)">
      <span>✈️</span> Viaggi
    </button>
  </nav>

  <!-- Hint Overlay for interaction -->
  <div class="scene-hint">
    Trascina per ruotare &bull; Rotellina / Pinch per zoom &bull; Clicca su un ufficio o agente
  </div>

  <!-- Side Detail Drawer (HUD) -->
  <aside id="side-drawer" class="side-drawer glass-panel">
    <div class="drawer-header">
      <div>
        <span id="drawer-badge" class="room-badge" style="background: rgba(99,102,241,0.2); color: #818cf8;">Topic #1</span>
        <h2 id="drawer-title" class="room-modal-title">Ufficio Generale</h2>
      </div>
      <button id="close-drawer-btn" class="close-btn">&times;</button>
    </div>

    <p id="drawer-desc" class="drawer-description">
      Descrizione dell'ufficio...
    </p>

    <div class="section-label">
      <span>🤖</span> Agenti Assegnati all'Ufficio
    </div>

    <div id="drawer-agents-list" class="agents-grid">
      <!-- Injected via JavaScript -->
    </div>

    <div class="drawer-footer">
      <button id="open-tg-topic-btn" class="tg-open-btn">
        <span>✈️</span> Apri Topic sul Forum Telegram
      </button>
    </div>
  </aside>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
